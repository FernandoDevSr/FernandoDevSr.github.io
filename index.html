<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="FA APP STUDIO — desarrollo de aplicaciones y productos digitales.">
  <title>FA APP STUDIO</title>
  <style>
    :root{color-scheme:light dark;--bg:#0b1020;--card:#141b2d;--text:#f7f9fc;--muted:#b9c1d1;--accent:#7aa2ff;--line:#27324a}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#11182a);color:var(--text);min-height:100vh}
    main{max-width:900px;margin:0 auto;padding:64px 24px}
    .brand{font-weight:800;letter-spacing:.08em;font-size:clamp(2rem,6vw,4rem);margin:0}
    .tag{color:var(--muted);font-size:1.08rem;margin:12px 0 36px}
    .card{background:rgba(20,27,45,.92);border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:24px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
    h2{margin-top:0}
    a{color:#9db9ff}
    .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px}
    footer{margin-top:48px;color:var(--muted);font-size:.95rem}
  </style>
</head>
<body>
  <main>
    <p class="brand">FA APP STUDIO</p>
    <p class="tag">Aplicaciones simples, útiles y pensadas para funcionar bien.</p>

    <section class="card">
      <h2>Radio México de Siempre</h2>
      <p>Radio mexicana, rancheras, mariachi, corridos y música de campo en una aplicación sencilla y directa.</p>
      <div class="links">
        <a href="/privacy.html">Política de privacidad</a>
        <a href="mailto:faappstudio@gmail.com">Soporte</a>
      </div>
    </section>

    <footer>
      <p>Contacto: <a href="mailto:faappstudio@gmail.com">faappstudio@gmail.com</a></p>
      <p>© 2026 FA APP STUDIO</p>
    </footer>
  </main>
</body>
</html>
